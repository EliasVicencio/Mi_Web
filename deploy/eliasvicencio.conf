server {
    listen 80;
    listen [::]:80;
    server_name eliasvicencio.cl www.eliasvicencio.cl;

    root /var/www/eliasvicencio.cl;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|ico|webp|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
